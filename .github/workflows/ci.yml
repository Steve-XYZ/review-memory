name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reviewmemory
          POSTGRES_USER: reviewmemory
          POSTGRES_PASSWORD: reviewmemory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewmemory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REVIEWMEMORY_TEST_CONNECTIONSTRING: Host=localhost;Port=5432;Database=reviewmemory;Username=reviewmemory;Password=reviewmemory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - run: dotnet test --no-build
